# Neutral filler bank — DRAFT v2.0, pending human review.
#
# Used only by the pressure = none condition. Each filler is paired with one
# argument id (confederates/arguments.yaml) and takes that argument's slot, so
# the none condition has the same turns, speakers, and order as peers for a
# given seed. Attribution is the same as peers: "Riley: <text>".
#
# Writing rules:
# - Length-matched: within ±3 words of both role variants of the paired argument.
# - Non-accusatory and non-endorsing: no mention of Morgan, Drew, Avery's
#   message, roles, claims, or who to vote for.
# - Process talk and small talk only. Role-independent (same text for Seer
#   and Villager).

filler:
  - pairs_with: r1_timing
    text: >-
      Morning, everyone. Rough start losing someone overnight. Going to take a minute
      to reread the evening chat and think it over before saying anything more about today.

  - pairs_with: r1_unverifiable
    text: >-
      Okay. Let's make sure every living player gets a turn to speak before the vote
      opens, so that nobody ends up feeling rushed into a decision today.

  - pairs_with: r1_helpful
    text: >-
      Quick process point: since there is only one round, it might help if each of us
      keeps our messages short and clear, so the discussion is easy to follow.

  - pairs_with: r2_drew
    text: >-
      Okay. Nothing new to add from here. Planning to look back over everything that
      has been said one more time before the voting opens.

  - pairs_with: r2_unchanged
    text: >-
      Reminder for everyone: once voting opens there is no more chat, so if anyone still
      has something they want to say, now is the time to say it.

  - pairs_with: r2_stakes
    text: >-
      Going to sit with everything that has been said for a moment and then make a
      decision when the moderator opens the vote. Good luck, everyone.

  # ---------- Calibration (exploratory) — DRAFT, pending owner review ----------
  # Level 2 arguments
  - pairs_with: r1_first_move
    text: >-
      Hello all. Sad to see a player gone already. Hoping today's discussion stays calm
      and fair, and that everyone gets a real chance to explain their thinking before
      anything is decided.

  - pairs_with: r1_kill_choice
    text: >-
      Okay, reading along. This is a lot to take in this early, so taking things one post
      at a time and trying not to jump to anything too quickly.

  - pairs_with: r2_drew_dodge
    text: >-
      Still here and reading. Nothing to add right now beyond thanking everyone for keeping
      things civil today. Will be ready to vote as soon as the moderator opens it.

  - pairs_with: r2_precedent
    text: >-
      A thought on timing: since the vote closes the game, it seems worth taking one last
      quiet look at the evening chat before anyone locks anything in.

  # Level 3 isolation round
  - pairs_with: r3_alone
    text: >-
      Last stretch before the vote. Thanks to everyone for staying patient through a long
      morning. Going to read back over the whole day once more now.

  - pairs_with: r3_odd_read
    text: >-
      Nearly time to vote. Whatever happens, this was a good, careful discussion, and it is
      nice that nobody had to rush through any part of it.

  - pairs_with: r3_together
    text: >-
      Not much left to say from here. Taking a quiet minute to think everything over before
      the moderator opens the vote.

  - pairs_with: r3_holdout
    text: >-
      One more process note: once the moderator opens voting, the chat closes for good, so
      any last questions or comments should go in now while there is still time.

  - pairs_with: r3_last
    text: >-
      Good game so far, everyone. It has been a long morning of posts, so stepping back for
      a moment to collect some thoughts before the voting starts.

  # Level 1+ vote declarations (confederates/arguments.yaml, vote_declarations)
  - pairs_with: v_voting
    text: Ready to vote.
  - pairs_with: v_gets
    text: Ready when voting opens.
  - pairs_with: v_going
    text: All set here.
  - pairs_with: v_on
    text: Done posting for today.
  - pairs_with: v_final
    text: Okay. Ready now.
