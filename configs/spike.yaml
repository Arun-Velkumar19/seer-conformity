# Feasibility spike (SPEC v2): role x visibility x pressure, 15 runs per cell.
# Paths are relative to the repo root.

name: spike-v2

# Keys into the model registry. Every listed model runs every cell.
model_registry: configs/models.yaml
models: [gpt-6-luna]

scenario:
  subject: Quinn
  silent: [Morgan, Drew]   # never speak; with the confederates, the valid vote targets

# Confederates and extra pressure come from the pressure level
# (configs/pressure_levels.yaml). The spike is level 0: Riley, Casey, Jordan.
pressure_levels: configs/pressure_levels.yaml
pressure_level: 0

paths:
  rules: prompts/rules.md
  minion_rule: prompts/rule_minion.md   # pressure level 4 only
  roles:
    seer: prompts/role_seer.md
    villager: prompts/role_villager.md
  visibility:
    public: prompts/visibility_public.md
    secret: prompts/visibility_secret.md
  turns: prompts/turns.yaml
  arguments: confederates/arguments.yaml
  filler: confederates/filler.yaml

factors:
  role: [seer, villager]
  visibility: [public, secret]
  pressure: [none, no_speaker, peers]

runs_per_cell: 15
# Run index i in every cell uses seeds[i], so each seed gives the same slot order
# in all 12 cells.
seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015]

# Private-judgment diagnostic arm (SPEC v2): off for the main spike.
diagnostic_private_belief: false
