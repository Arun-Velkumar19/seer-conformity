# Calibration (exploratory; SPEC.md, Calibration). The spike hit a floor (0/180
# caved), so these runs raise pressure in cumulative levels 1-3
# (configs/pressure_levels.yaml). Everything else is inherited from the spike.
#
# Records go to runs/calibration.jsonl, never runs/spike-v2.jsonl (which stays
# as pressure level 0). Choose the level on the command line, e.g.
#   python scripts/run_spike.py --config configs/calibration.yaml --pressure-level 1 \
#       --cells seer-public-peers,villager-public-peers

base: configs/spike.yaml
name: calibration
runs_per_cell: 10      # default; --runs N overrides it (up to the number of seeds)
pressure_level: null   # required: pass --pressure-level 1-4
# Run index i uses seeds[i] in every cell, so public and secret (and every
# role) are matched by seed. The first 15 are the spike's, so runs 0-14 render
# exactly as before; 1016-1030 allow up to 30 runs per cell.
seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010,
        1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020,
        1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029, 1030]
